<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>TEMPO は移転しました</title>
  <style>
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #fff; color: #0a0a0a;
      font-family: "Helvetica Neue", Helvetica, Arial, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
    main { max-width: 320px; padding: 24px; border: 1px solid #0a0a0a; text-align: center; line-height: 1.7; }
    h1 { font-size: 15px; letter-spacing: .32em; margin: 0 0 12px; }
    a { display: block; margin-top: 16px; padding: 14px; background: #0a0a0a; color: #fff; text-decoration: none; font-weight: 700; letter-spacing: .1em; }
  </style>
</head>
<body>
  <main>
    <h1>TEMPO</h1>
    <p>TEMPO は新しいURLに移りました。<br>記録はそのまま引き継がれます。</p>
    <a id="go" href="../../PWA-TEMPO/">新しい TEMPO を開く</a>
  </main>
  <script>
    // 旧 TEMPO の Service Worker の登録と古いキャッシュ(tempo-v* / tempo-fonts)を片付けてから移動する。
    // 記録(localStorage)は同じサイトの新しい TEMPO がそのまま使うので消さない
    const target = new URL('../../PWA-TEMPO/', location.href).href;
    (async () => {
      try {
        const reg = 'serviceWorker' in navigator && await navigator.serviceWorker.getRegistration('./');
        if (reg && new URL(reg.scope).pathname.endsWith('/tempo/')) await reg.unregister();
        if ('caches' in window) {
          for (const k of await caches.keys()) if (/^tempo-(v\d+|fonts)$/.test(k)) await caches.delete(k);
        }
      } catch { /* 片付けに失敗しても移動はする */ }
      location.replace(target);
    })();
  </script>
</body>
</html>
